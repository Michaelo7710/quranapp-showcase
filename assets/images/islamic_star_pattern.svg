      <line x1="0" y1="0" x2="40" y2="40" stroke="#047857" stroke-width="0.5" stroke-opacity="0.08" />
      <line x1="40" y1="0" x2="0" y2="40" stroke="#047857" stroke-width="0.5" stroke-opacity="0.08" />
    </pattern>
