<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320" fill="none">
  <defs>
    <radialGradient id="dialBgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#047857" stop-opacity="0.08" />
      <stop offset="70%" stop-color="#047857" stop-opacity="0.02" />
      <stop offset="100%" stop-color="#047857" stop-opacity="0.0" />
    </radialGradient>
  </defs>

  <!-- Background Ambient Circle -->
  <circle cx="160" cy="160" r="150" fill="url(#dialBgGlow)" />
  <circle cx="160" cy="160" r="148" stroke="#10B981" stroke-width="1.5" stroke-opacity="0.3" />
  <circle cx="160" cy="160" r="140" stroke="#047857" stroke-width="0.8" stroke-dasharray="3 3" stroke-opacity="0.4" />
  <circle cx="160" cy="160" r="115" stroke="#D97706" stroke-width="1" stroke-opacity="0.25" />
  <circle cx="160" cy="160" r="85" stroke="#10B981" stroke-width="0.6" stroke-dasharray="4 4" stroke-opacity="0.3" />

  <!-- Sacred 8-Pointed Star Center Ornament -->
  <g transform="translate(160, 160)" stroke="#D97706" stroke-width="1" stroke-opacity="0.25" fill="none">
    <rect x="-42" y="-42" width="84" height="84" rx="2" />
    <rect x="-42" y="-42" width="84" height="84" rx="2" transform="rotate(45)" />
    <circle cx="0" cy="0" r="42" />
  </g>

  <!-- Cardinal Points Texts -->
  <!-- North (U - Utara / N) -->
  <g transform="translate(160, 32)">
    <text text-anchor="middle" y="0" font-family="sans-serif" font-size="14" font-weight="900" fill="#DC2626" letter-spacing="1">U</text>
    <text text-anchor="middle" y="13" font-family="sans-serif" font-size="9" font-weight="600" fill="#DC2626" opacity="0.8">0°</text>
  </g>

  <!-- East (T - Timur / E) -->
  <g transform="translate(290, 164)">
    <text text-anchor="middle" y="0" font-family="sans-serif" font-size="13" font-weight="800" fill="#64748B">T</text>
    <text text-anchor="middle" y="12" font-family="sans-serif" font-size="8" font-weight="600" fill="#64748B" opacity="0.8">90°</text>
  </g>

  <!-- South (S - Selatan / S) -->
  <g transform="translate(160, 296)">
    <text text-anchor="middle" y="0" font-family="sans-serif" font-size="13" font-weight="800" fill="#64748B">S</text>
    <text text-anchor="middle" y="12" font-family="sans-serif" font-size="8" font-weight="600" fill="#64748B" opacity="0.8">180°</text>
  </g>

  <!-- West (B - Barat / W) -->
  <g transform="translate(32, 164)">
    <text text-anchor="middle" y="0" font-family="sans-serif" font-size="13" font-weight="800" fill="#64748B">B</text>
    <text text-anchor="middle" y="12" font-family="sans-serif" font-size="8" font-weight="600" fill="#64748B" opacity="0.8">270°</text>
  </g>

  <!-- Intercardinal Markers -->
  <text x="245" y="75" font-family="sans-serif" font-size="9" font-weight="700" fill="#94A3B8" text-anchor="middle">TL</text>
  <text x="245" y="255" font-family="sans-serif" font-size="9" font-weight="700" fill="#94A3B8" text-anchor="middle">TG</text>
  <text x="75" y="255" font-family="sans-serif" font-size="9" font-weight="700" fill="#94A3B8" text-anchor="middle">BD</text>
  <text x="75" y="75" font-family="sans-serif" font-size="9" font-weight="700" fill="#94A3B8" text-anchor="middle">BL</text>
</svg>
