<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <!-- Compass Outer Circle -->
  <circle cx="24" cy="24" r="19" stroke="currentColor" stroke-width="2.5" />
  <circle cx="24" cy="24" r="15" stroke="currentColor" stroke-width="1.2" stroke-dasharray="2 3" opacity="0.5" />
  
  <!-- Compass Needle (North pointing towards Kaaba) -->
  <polygon points="24,8 28,24 24,21 20,24" fill="#047857" stroke="#047857" stroke-width="1" />
  <polygon points="24,40 28,24 24,27 20,24" fill="currentColor" opacity="0.3" stroke="currentColor" stroke-width="1" />
  
  <!-- Mini Kaaba Cube at North Top -->
  <rect x="21" y="2" width="6" height="6" rx="1" fill="#0F172A" stroke="#D97706" stroke-width="1" />
  <line x1="21" y1="4" x2="27" y2="4" stroke="#D97706" stroke-width="0.8" />
  
  <!-- Pivot point -->
  <circle cx="24" cy="24" r="2.5" fill="#D97706" />
</svg>
