<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" fill="none">
  <defs>
    <!-- Emerald to Forest Green Gradient for North Pointer -->
    <linearGradient id="emeraldNeedle" x1="100" y1="20" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Golden Accent Gradient for Kaaba Crown -->
    <linearGradient id="goldCrown" x1="85" y1="15" x2="115" y2="35" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <!-- South Pointer Dark Gradient -->
    <linearGradient id="southPointer" x1="100" y1="100" x2="100" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#64748B" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

  <!-- North Pointer (Qibla / Kaaba Arrow) -->
  <g>
    <path d="M 100 25 L 86 95 Q 100 88 100 100 Q 100 88 114 95 Z" fill="url(#emeraldNeedle)" />
    <!-- Center Crease / Light Reflection -->
    <path d="M 100 25 L 100 96 L 114 95 Z" fill="#34D399" opacity="0.35" />
  </g>

  <!-- Sacred Kaaba Crown at Top Tip -->
  <g transform="translate(100, 22)">
    <!-- Golden Crescent Finial -->
    <path d="M 0 -8 A 5 5 0 0 1 5 -3 A 4 4 0 0 0 0 -5 A 4 4 0 0 0 -5 -3 A 5 5 0 0 1 0 -8 Z" fill="url(#goldCrown)" />
    <!-- Miniature Kaaba Silhouette -->
    <rect x="-6" y="-3" width="12" height="12" rx="1.5" fill="#0F172A" stroke="url(#goldCrown)" stroke-width="1.2" />
    <!-- Kiswah Gold Band -->
    <line x1="-6" y1="0.5" x2="6" y2="0.5" stroke="url(#goldCrown)" stroke-width="1" />
  </g>

  <!-- Islamic 8-Pointed Star Rosette Pivot (Rub el Hizb) -->
  <g transform="translate(100, 100)">
    <!-- Base Outer Gold Ring -->
    <circle cx="0" cy="0" r="16" fill="url(#goldCrown)" />
    <circle cx="0" cy="0" r="13" fill="#064E3B" />
    
    <!-- 8-Pointed Star Medallion -->
    <rect x="-8.5" y="-8.5" width="17" height="17" rx="1" fill="url(#goldCrown)" />
    <rect x="-8.5" y="-8.5" width="17" height="17" rx="1" transform="rotate(45)" fill="url(#goldCrown)" />

    <!-- Inner Core Jewel -->
    <circle cx="0" cy="0" r="6" fill="#047857" stroke="#FDE68A" stroke-width="1" />
    <circle cx="0" cy="0" r="2.5" fill="#FBBF24" />
  </g>
</svg>
