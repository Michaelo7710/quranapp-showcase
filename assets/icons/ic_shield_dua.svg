<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <!-- Outer Shield Outline -->
  <path d="M24 4L9 10V22C9 32.5 15.5 41.8 24 44C32.5 41.8 39 32.5 39 22V10L24 4Z" 
        stroke="#059669" stroke-width="2.5" stroke-linejoin="round" fill="#10B981" fill-opacity="0.15" />
        
  <!-- Inner Shield Inset Border -->
  <path d="M24 8L13 12.5V22C13 30.2 17.8 37.6 24 39.5C30.2 37.6 35 30.2 35 22V12.5L24 8Z" 
        stroke="#059669" stroke-width="1.5" stroke-linejoin="round" opacity="0.6" />
        
  <!-- Center 8-pointed Star (Rub el Hizb symbol of protection) -->
  <!-- Square 1 -->
  <rect x="19" y="19" width="10" height="10" rx="1" 
        stroke="#D97706" stroke-width="1.8" fill="#F59E0B" fill-opacity="0.3" />
  <!-- Square 2 rotated 45 deg around (24, 24) -->
  <rect x="19" y="19" width="10" height="10" rx="1" 
        transform="rotate(45 24 24)" 
        stroke="#D97706" stroke-width="1.8" fill="#F59E0B" fill-opacity="0.3" />
  <!-- Center Dot -->
  <circle cx="24" cy="24" r="1.5" fill="#D97706" />
</svg>
